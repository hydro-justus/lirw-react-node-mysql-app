AWSTemplateFormatVersion: '2010-09-09'
Description: Security groups for the 3-tier application

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the security groups will be created

  BackendPort:
    Type: Number
    Default: 3200
    Description: Port used by the backend application

Resources:

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the internet to the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: 3tier-alb-sg

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow backend traffic from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref BackendPort
          ToPort: !Ref BackendPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: 3tier-ecs-sg

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL traffic from ECS backend
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: 3tier-database-sg

Outputs:

  ALBSecurityGroupId:
    Description: Security group ID for the Application Load Balancer
    Value: !Ref ALBSecurityGroup

  ECSSecurityGroupId:
    Description: Security group ID for ECS tasks
    Value: !Ref ECSSecurityGroup

  DatabaseSecurityGroupId:
    Description: Security group ID for RDS
    Value: !Ref DatabaseSecurityGroup
